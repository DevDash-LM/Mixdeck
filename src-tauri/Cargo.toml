[package]
name = "mixdeck"
version = "0.1.1"
description = "A control surface for Voicemeeter Potato"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "mixdeck_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-store = "2.5.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-log = "2.10.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
log = "0.4.35"
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
tokio = { version = "1.54", features = ["sync", "time"] }
libloading = "0.9"
windows-registry = "0.6.1"
tauri-plugin-dialog = "2.8.4"
# App sessions: Windows Core Audio + process names/icons. Same versions
# Tauri already pulls in; only the features `sessions/` uses.
png = "0.18.1"

[dependencies.windows]
version = "0.62.2"
features = [
  "Win32_Foundation",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-global-shortcut = "2.4.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind" # the engine worker catches panics and restarts
strip = true
